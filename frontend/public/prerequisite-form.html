<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Pre-Requisite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --panel:#ffffff; --border:#E3DED6; --text:#253338; --dim:#66797D;
  --accent:#217E79; --accent-bg:#E6F1F0; --danger:#C84630; --danger-bg:#F7E5E0; --ok:#1D724D; --ok-bg:#E3F1E9; --warn:#A16207; --warn-bg:#FBF1DC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.5;}
a{color:var(--accent);}
input,select,textarea,button{font-family:inherit;font-size:14px;color:inherit;}
h1,h2,h3{margin:0;}

.shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);padding:14px 8px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;}
.sidebar .brand{font-size:14px;font-weight:800;padding:4px 10px 2px;}
.sidebar .brand-sub{font-size:12px;color:var(--dim);padding:0 10px 10px;}
.progress{margin:0 10px 12px;}
.progress .bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;}
.progress .bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.progress .lbl{font-size:11.5px;color:var(--dim);margin-top:4px;}
.vstep-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.8px;font-weight:600;color:var(--dim);}
.vstep-item.active{background:var(--accent-bg);color:var(--accent);}
.vstep-item:hover:not(.active){background:var(--bg);}
.vstep-circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--panel);}
.vstep-item.active .vstep-circle{border-color:var(--accent);color:var(--accent);}
.vstep-item.done .vstep-circle{border-color:var(--ok);background:var(--ok);color:#fff;}
.sidebar-foot{padding:10px 8px;border-top:1px solid var(--border);margin-top:8px;}
.sidebar-foot button{width:100%;margin-bottom:6px;}

.content{flex:1;min-width:0;}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5;}
.appbar .inst{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.savestate{font-size:12.5px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.savestate.err{color:var(--danger);}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}
.savestate.busy .dot{background:var(--warn);}
.savestate.err .dot{background:var(--danger);}
.content-topbar{border-bottom:1px solid var(--border);padding:10px 22px;overflow-x:auto;background:var(--panel);}
.content-body{padding:18px 22px 70px;max-width:1100px;overflow-wrap:anywhere;}

.stepper-scroll{overflow-x:auto;}
.stepper{display:inline-flex;align-items:center;white-space:nowrap;}
.stepper-item{display:inline-flex;align-items:center;flex-shrink:0;cursor:pointer;}
.stepper-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--dim);flex-shrink:0;background:var(--panel);}
.stepper-item.active .stepper-circle{border-color:var(--accent);color:var(--accent);}
.stepper-label{margin-left:6px;font-size:12.8px;font-weight:600;color:var(--dim);}
.stepper-item.active .stepper-label{color:var(--text);}
.stepper-line{width:18px;height:2px;background:var(--border);margin:0 6px;flex-shrink:0;}

h2.title{font-size:18px;margin-bottom:12px;}
.box{border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;background:var(--panel);}
.field{margin-bottom:14px;}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row > .field{flex:1;min-width:190px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=url],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);
}
input:disabled,select:disabled,textarea:disabled{background:var(--bg);color:var(--text);opacity:1;cursor:default;}
textarea{resize:vertical;min-height:48px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);}
.radio-row,.check-row{display:flex;gap:14px;flex-wrap:wrap;}
.radio-row label,.check-row label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:13.5px;}

button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13.5px;cursor:pointer;}
button:hover{background:var(--accent-bg);}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
button.primary:hover{filter:brightness(.95);}
button.link{border:none;background:none;color:var(--accent);text-decoration:underline;padding:4px 0;font-weight:600;}
button.link.danger{color:var(--danger);}
button.small{padding:4px 9px;font-size:12.5px;}
button:disabled{opacity:.4;cursor:not-allowed;}

.dtable-wrap{overflow-x:auto;margin-bottom:8px;}
table.dtable{width:100%;border-collapse:collapse;font-size:13px;}
.dtable th{text-align:left;font-size:10.8px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);padding:6px 6px;white-space:nowrap;}
.dtable td{border-bottom:1px solid var(--border);padding:4px 5px;vertical-align:top;}
.dtable td input,.dtable td select,.dtable td textarea{padding:5px 6px;font-size:13px;min-width:160px;}
.dtable td select{min-width:180px;}
.dtable td textarea{min-height:34px;min-width:180px;}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chips .chip{border:1px solid var(--border);border-radius:6px;padding:4px 6px 4px 10px;font-size:12.8px;background:var(--panel);display:flex;align-items:center;gap:6px;}
.chips .chip button{padding:0;border:none;background:none;color:var(--danger);font-weight:800;}
.opt-add-row{display:flex;gap:6px;max-width:360px;}
.opt-add-row input{flex:1;}

.field-row{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel);}
.field-row .summary{padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.field-row .summary .txt{font-size:13.5px;}
.field-row .summary .txt .type{color:var(--dim);font-size:12px;}
.field-row .edit{border-top:1px solid var(--border);padding:14px;background:var(--accent-bg);}

.stage-list{list-style:none;margin:0;padding:0;}
.stage-list li{border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--panel);}
.stage-list .meta{font-size:12.5px;color:var(--dim);margin-top:3px;}

.edit-banner{background:var(--accent-bg);border:1px solid var(--accent);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:14px;}
.status-banner{background:var(--accent-bg);border-radius:8px;padding:9px 13px;font-size:13px;font-weight:600;margin-bottom:16px;}
.lock-banner{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
.view-banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px;}
.pending-list{background:var(--warn-bg);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:13px;z-index:9999;}
.empty{color:var(--dim);font-size:13.5px;padding:12px 0;}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}
.req{color:var(--danger);}
.pv-field{margin-bottom:14px;}
.pv-file{border:1px dashed var(--border);border-radius:8px;padding:12px;color:var(--dim);font-size:13px;}
.choice-row{display:flex;flex-wrap:wrap;gap:8px;}
.choice-row label{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px;}
.center-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
.center-msg .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 32px;max-width:420px;}

@media (max-width:840px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:4px;}
  .sidebar .brand,.sidebar .brand-sub,.progress{display:none;}
  .vstep-item{flex-shrink:0;}
  .sidebar-foot{display:none;}
  .appbar{position:static;}
  .content-body{padding:14px 14px 60px;}
}
@media print{
  .sidebar, .content-topbar, .appbar, .pager, button, .lock-banner, .view-banner{ display:none !important; }
  .content, .content-body{ padding:0 !important; max-width:100% !important; }
  .box{ page-break-inside:avoid; border:1px solid #999; }
  body{ font-size:11px; background:#fff; }
}
</style>
</head>
<body>
<div id="root"><div class="center-msg"><div class="card">Loading…</div></div></div>

<script>
/* ============================= SERVER LINK ============================= */
// Opened as /prerequisites/<token> (the page loads this file in a frame with ?t=<token>).
// ?view=1 is the team's read-only view (uses the signed-in user's session instead of the token).
const QS = new URLSearchParams(location.search);
const TOKEN = (QS.get('t') || '').trim();
const API_BASE = (QS.get('api') || '').replace(/\/+$/,'');
const VIEW = QS.get('view') === '1';
const PUBLIC_URL = `${API_BASE}/api/public/prereq/${encodeURIComponent(TOKEN)}`;
let LOCKED = false;          // submitted → read-only for the client
let SUBMIT_INFO = null;      // { at, name }
let INSTITUTE = '';
let SAVED_SECTIONS = {};     // sectionKey → savedAt
let saveTimer = null, dirty = false, saving = false;
let saveStatus = { kind:'ok', text:'' };

async function api(method, url, body, auth){
  const headers = { 'Content-Type':'application/json' };
  if(auth){ const t = localStorage.getItem('wacrm_token'); if(t) headers.Authorization = 'Bearer ' + t; }
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, keepalive: method !== 'GET' && JSON.stringify(body||{}).length < 60000 });
  let json = null; try{ json = await res.json(); }catch(e){}
  if(!res.ok || (json && json.ok === false)){ const err = new Error((json && (json.error || json.message)) || ('Request failed (' + res.status + ')')); err.status = res.status; throw err; }
  return json ? json.data : null;
}
const readOnly = () => LOCKED || VIEW;
function fmtTime(d){ if(!d) return ''; const x = new Date(d); return x.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function fmtDate(d){ if(!d) return ''; const x = new Date(d); const p = n => String(n).padStart(2,'0'); return `${p(x.getDate())}-${p(x.getMonth()+1)}-${x.getFullYear()} ${fmtTime(x)}`; }

function setSaveStatus(kind, text){ saveStatus = {kind, text}; const el = document.getElementById('saveState'); if(el){ el.className = 'savestate ' + (kind==='ok'?'':kind); el.innerHTML = `<span class="dot"></span>${escapeHtml(text)}`; } }

/** Save to the server. `section` marks that section as received. */
async function persist(section){
  if(readOnly()) return true;
  clearTimeout(saveTimer); saveTimer = null;
  saving = true; setSaveStatus('busy', 'Saving…');
  try{
    const out = await api('PUT', PUBLIC_URL, { data: state, section: section || undefined });
    dirty = false;
    SAVED_SECTIONS = out.sections || SAVED_SECTIONS;
    setSaveStatus('ok', 'Saved ' + fmtTime(out.lastSavedAt));
    return true;
  }catch(e){
    if(e.status === 409){ await boot(); showToast('This form has been submitted.'); return false; }
    setSaveStatus('err', 'Not saved — check your connection');
    showToast(e.message || 'Could not save');
    return false;
  }finally{ saving = false; }
}
function scheduleAutosave(){
  if(readOnly()) return;
  dirty = true; setSaveStatus('busy', 'Unsaved changes');
  clearTimeout(saveTimer); saveTimer = setTimeout(()=>persist(), 1500);
}
window.addEventListener('beforeunload', (e)=>{
  if(dirty && !readOnly()){
    try{ fetch(PUBLIC_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({data: state}), keepalive:true }); }catch(err){}
  }
});

/* ============================= UTIL ============================= */
let uidCounter = 1;
function uid(p){ return p + (uidCounter++); }
function escapeHtml(str){ return (str==null?'':String(str)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(str){ return (str==null?'':String(str)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
let pendingRemoveKey = null;

/* ============================= SECTIONS ============================= */
const SECTIONS = [
  {key:'institute', label:'Institute & Employees'},
  {key:'branches', label:'Branch Details'},
  {key:'enquiryStages', label:'Enquiry Stages'},
  {key:'appProcess', label:'Application Process'},
  {key:'integrations', label:'Integrations'},
  {key:'whatsapp', label:'WhatsApp Setup'},
  {key:'academic', label:'Academic Details'},

  {key:'sources', label:'Enquiry Sources & Numbering'},
  {key:'fee', label:'Fee & Documents'},
  {key:'assign', label:'Assignment Rules'},
  {key:'forms', label:'Forms & Landing Page'},
  {key:'templates', label:'Communication Templates'},
  {key:'preview', label:'Preview & Submit'},
];
const REQUIRED_SECTIONS = SECTIONS.filter(s=>s.key!=='preview');

  ],

  feeDocuments:[

  ],
  queryCategories:['Age Criteria','Academics','Payment Failure','Application Form'],

  whatsappChecklist:[
    {item:'Exhibit B — signed & stamped on letterhead', provided:false},
    {item:'WABA document', provided:false},
    {item:'Facebook login access', provided:false},

  return [
    {wing:'Pre-Primary Wing', class:'Nursery', sections:''},
    {wing:'Pre-Primary Wing', class:'Junior KG', sections:''},
    {wing:'Pre-Primary Wing', class:'Senior KG', sections:''},

function buildTemplatesDefault(){
  const cats = [
    {cat:'OTP', events:['Mobile No. Verification OTP','Email ID Verification OTP']},
    {cat:'Enquiry', events:['Enquiry Acknowledgment']},
    {cat:'School Tour', events:['School Tour Invite','School Tour Reminder','School Tour Thank You']},
    {cat:'Follow-up', events:['One-to-One Meeting Invite']},
    {cat:'Login', events:['Candidate Login Credentials','Forget Password OTP']},
    {cat:'Registration', events:['Application Form Invite','Application Submission Acknowledgement','Registration Fee Invite','Registration Fee Payment Acknowledgement','Interaction Invite','Interaction Acknowledgement','Pending Document Notification','Admission Payment Invite','Admission Payment Acknowledgement','Payment Pending Reminder']},
    {cat:'Status Change', events:['Application Approved','Application In Review','Application On Hold','Application Rejected']},
    {cat:'Counsellor-End', events:['New Lead Notification']},

/* ============================= GENERIC TABLE COMPONENT ============================= */
const TABLES = {};
function registerTable(id, getFn, blankFn){ TABLES[id] = {get:getFn, blank:blankFn}; }

function renderDTable(id, columns){
  const list = TABLES[id].get();
  let html = `<div class="dtable-wrap"><table class="dtable"><thead><tr>`;
  columns.forEach(c=>html+=`<th>${escapeHtml(c.label)}</th>`);
  html += `<th></th></tr></thead><tbody>`;
  list.forEach((row,i)=>{
    html+=`<tr>`;
    columns.forEach(c=>{
      const val = row[c.key];
      if(c.type==='checkbox'){
        html+=`<td style="text-align:center;"><input type="checkbox" ${val?'checked':''} onchange="dtableUpdate('${id}',${i},'${c.key}',this.checked)"></td>`;
      } else if(c.type==='select'){
        html+=`<td><select onchange="dtableUpdate('${id}',${i},'${c.key}',this.value)">${c.options.map(o=>`<option ${val===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select></td>`;
      } else if(c.type==='readonly'){
        html+=`<td>${escapeHtml(val||'')}</td>`;
      } else if(c.type==='textarea'){
        html+=`<td><textarea oninput="dtableUpdate('${id}',${i},'${c.key}',this.value)">${escapeHtml(val||'')}</textarea></td>`;
      } else {
        const isDupCheck = (c.key==='mobile' || c.key==='email');
        html+=`<td><input type="${c.type||'text'}" value="${escapeAttr(val==null?'':val)}" oninput="dtableUpdate('${id}',${i},'${c.key}',this.value)" ${isDupCheck?`onblur="validateEmpDup('${id}',${i},'${c.key}')"`:''}>${isDupCheck?`<div id="emperr_${id}_${i}_${c.key}" style="color:var(--danger);font-size:11px;margin-top:2px;"></div>`:''}</td>`;
      }
    });
    const pk = id+'_'+i;
    html += `<td><button class="small link danger" title="Remove" onclick="dtableRemove('${id}',${i})">${pendingRemoveKey===pk?'Confirm?':'✕'}</button></td></tr>`;
  });
  html += `</tbody></table></div><button onclick="dtableAdd('${id}')">+ Add Row</button>`;
  return html;
}
function dtableUpdate(id, idx, key, value){
  const row = TABLES[id].get()[idx];
  row[key] = value;
  if(key==='salutation'){
    if(value==='Mr.') row.gender='Male';
    else if(value==='Ms.'||value==='Mrs.') row.gender='Female';
    saveState(); renderAll(); return;
  }
  saveState();
}
function getAllEmployeeRows(){
  const rows = [];
  (state.institute.employees||[]).forEach(e=>rows.push(e));
  (state.branches||[]).forEach(b=>(b.employees||[]).forEach(e=>rows.push(e)));
  return rows;
}
function validateEmpDup(id, idx, key){
  const row = TABLES[id].get()[idx];
  const val = (row[key]||'').trim();
  const el = document.getElementById(`emperr_${id}_${idx}_${key}`);
  if(!el) return;
  if(!val){ el.textContent=''; return; }
  const dup = getAllEmployeeRows().some(r=> r!==row && (r[key]||'').trim().toLowerCase()===val.toLowerCase());
  el.textContent = dup ? `This ${key==='mobile'?'mobile number':'email'} is already used by another employee.` : '';
}
function dtableAdd(id){ TABLES[id].get().push(TABLES[id].blank()); saveState(); renderAll(); }
function dtableRemove(id, idx){
  const pk = id+'_'+idx;
  if(pendingRemoveKey===pk){ TABLES[id].get().splice(idx,1); pendingRemoveKey=null; saveState(); renderAll(); }
  else { pendingRemoveKey=pk; renderAll(); setTimeout(()=>{ if(pendingRemoveKey===pk){pendingRemoveKey=null; renderAll();} }, 3000); }
}

/* generic chip (tag) list component, for plain string arrays */
function renderChipList(id){
  const list = TABLES[id].get();
  let html = `<div class="chips">`;
  list.forEach((v,i)=>{ html += `<span class="chip">${escapeHtml(v)}<button onclick="chipRemove('${id}',${i})">×</button></span>`; });
  html += `</div><div class="opt-add-row"><input type="text" id="chipin_${id}" placeholder="Add item" onkeydown="if(event.key==='Enter'){event.preventDefault();chipAdd('${id}')}"><button onclick="chipAdd('${id}')">Add</button></div>`;
  return html;
}
function chipAdd(id){
  const inp = document.getElementById('chipin_'+id);
  const v = (inp.value||'').trim();
  if(!v) return;
  TABLES[id].get().push(v);
  saveState(); renderAll();
}
function chipRemove(id, idx){ TABLES[id].get().splice(idx,1); saveState(); renderAll(); }

function renderSidebar(){

function goSection(key){ state.activeSection = key; if(!readOnly()) saveState(); renderAll(); window.scrollTo(0,0); }

function renderTopStepper(){
  const el = document.getElementById('topStepper');
  const items = getSubStepsFor(state.activeSection);
  if(!items){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='block';
  const active = getSub(state.activeSection);
  el.innerHTML = `<div class="stepper-scroll"><div class="stepper">` + items.map((label,i)=>{
    const cls = ['stepper-item']; if(i===active) cls.push('active');
    const line = i<items.length-1 ? '<div class="stepper-line"></div>' : '';
    return `<div class="${cls.join(' ')}" onclick="setSub('${state.activeSection}',${i})"><div class="stepper-circle">${i+1}</div><div class="stepper-label">${escapeHtml(label)}</div></div>${line}`;
  }).join('') + `</div></div>`;
}
function getSubStepsFor(key){
  if(key==='institute') return ['Institute Info','Employees','Communication Email'];
  if(key==='branches') return readOnly() ? (state.branches.length ? state.branches.map(b=>b.name||'Branch') : null) : state.branches.map(b=>b.name||'Branch').concat(['+ Add Branch']);
  if(key==='appProcess') return ['Create Stages','Add Fields','Preview'];
  if(key==='faq') return ['FAQs','Query Categories'];
  if(key==='sources') return ['Enquiry Sources','Auto-Numbering'];
  if(key==='fee') return ['Fee by Class','Documents Required'];
  if(key==='templates') return [...new Set(state.templates.map(t=>t.category))];
  return null;
}

function renderSection(){
  const k = state.activeSection;
  let body = '';
  if(k==='institute') body = renderInstitute();
  else if(k==='branches') body = renderBranches();
  else if(k==='enquiryStages') body = renderEnquiryStages();
  else if(k==='appProcess') body = renderAppProcess();
  else if(k==='integrations') body = renderIntegrations();
  else if(k==='whatsapp') body = renderWhatsapp();
  else if(k==='academic') body = renderAcademic();
  else if(k==='faq') body = renderFaq();
  else if(k==='sources') body = renderSources();
  else if(k==='fee') body = renderFee();
  else if(k==='assign') body = renderAssign();
  else if(k==='forms') body = renderForms();
  else if(k==='templates') body = renderTemplates();
  else if(k==='preview') body = renderPreviewAll();
  return body + renderPageFooter();
}

/* ============================= PREVIOUS / SAVE & NEXT (every page) ============================= */
function currentSectionIndex(){ return SECTIONS.findIndex(s=>s.key===state.activeSection); }
function realSubCount(key){
  if(key==='branches') return state.branches.length;
  const subs = getSubStepsFor(key);
  return subs ? subs.length : 1;
}
function isLastOverallStep(){
  const idx = currentSectionIndex();
  if(idx !== SECTIONS.length-1) return false;
  const key = state.activeSection;
  if(key==='appProcess') return ap().phase==='preview';
  const subCount = realSubCount(key);
  return !(subCount>0 && getSub(key) < subCount-1);
}
function isFirstOverallStep(){
  if(currentSectionIndex() !== 0) return false;
  if(state.activeSection==='appProcess') return ap().phase==='stages';
  return getSub(state.activeSection)===0;
}
function renderPageFooter(){
  const last = isLastOverallStep();
  const first = isFirstOverallStep();
  const ro = readOnly();
  return `<div class="pager" style="margin-top:22px;border-top:1px solid var(--border);padding-top:16px;">
    ${first ? '<span></span>' : `<button data-keep onclick="saveAndPrev()">← Previous</button>`}
    ${last ? '' : `<button data-keep class="primary" onclick="saveAndNext()">${ro?'Next →':'Save &amp; Next'}</button>`}
  </div>`;
}
async function saveAndPrev(){
  const key = state.activeSection;
  if(!readOnly()){ if(!(await persist(key))) return; showToast('Saved'); }
  if(key==='appProcess'){ apSaveAndPrev(); return; }
  const curSub = getSub(key);
  if(curSub>0){ setSub(key, curSub-1); return; }
  const idx = currentSectionIndex();
  if(idx>0) goSection(SECTIONS[idx-1].key);
}
function apSaveAndPrev(){
  const phase = ap().phase;
  if(phase==='preview'){ apGoPhase('fields'); }
  else if(phase==='fields'){
    if(ap().currentStageIndex>0) apPrevStage();
    else apGoPhase('stages');
  } else {
    const idx = currentSectionIndex();
    if(idx>0) goSection(SECTIONS[idx-1].key);
  }
}
async function saveAndNext(){
  const key = state.activeSection;
  if(!readOnly()){ if(!(await persist(key))) return; showToast('Saved'); renderSidebar(); }
  if(key==='appProcess'){ apSaveAndNext(); return; }
  const subCount = realSubCount(key);
  const curSub = getSub(key);
  if(subCount>0 && curSub < subCount-1){ setSub(key, curSub+1); return; }
  const idx = currentSectionIndex();
  if(idx < SECTIONS.length-1) goSection(SECTIONS[idx+1].key);
}
function apSaveAndNext(){
  const phase = ap().phase;
  if(phase==='stages'){
    if(ap().stages.length===0){ showToast('Add at least one stage first.'); return; }
    apGoPhase('fields');
  } else if(phase==='fields'){
    if(ap().currentStageIndex < ap().stages.length-1) apNextStage();
    else apGoPhase('preview');
  } else {
    const idx = currentSectionIndex();
    if(idx < SECTIONS.length-1) goSection(SECTIONS[idx+1].key);
  }
}

  {v:'Choice', l:'Choice Buttons (pick one)', opts:true}, {v:'MultiSelect', l:'Multi-Select (pick many)', opts:true},
  {v:'Checkbox', l:'Checkbox (Yes/No)'}, {v:'PhotoUpload', l:'Photo Upload', file:true}, {v:'DocumentUpload', l:'Document Upload', file:true},
  {v:'Signature', l:'Signature', file:true}, {v:'Payment', l:'Payment (system)', file:true}, {v:'SystemGenerated', l:'Auto-generated (system)', file:true},
];
const STATUS_OPTIONS = ['Application Initiated','Application In Process','Document Uploaded','Payment Done','Under Review','Approved','Rejected','Waitlisted','Admission Confirmed','Enrolled'];
function typeInfo(v){ return FIELD_TYPES.find(t=>t.v===v) || FIELD_TYPES[0]; }
function mkField(label, type, opts){
  opts = opts || {};
  return { id:uid('fd'), label, type, mandatory:!!opts.mandatory, options:(opts.options||[]).slice(), defaultValue:opts.defaultValue||'',
    condition:null, repeatsFor:'', restricted:!!opts.restricted, filledBy:'Parent', notes:'', _open:false };
}
function ap(){ return state.appProcess; }
function getStage(id){ return ap().stages.find(s=>s.id===id); }
function getField(stageId, fieldId){ const s=getStage(stageId); return s && s.fields.find(f=>f.id===fieldId); }

function renderAppProcess(){
  const phase = ap().phase;
  if(phase==='stages') return renderApStagesPhase();
  if(phase==='fields') return renderApFieldsPhase();
  return renderApPreviewPhase();
}
function apGoPhase(p){ ap().phase=p; setSub('appProcess', p==='stages'?0:(p==='fields'?1:2)); }

function renderApStagesPhase(){
  const editing = ap().editingStageId ? getStage(ap().editingStageId) : null;
  const typeVal = editing ? editing.type : Object.keys(STAGE_TYPES)[0];
  const nameVal = editing ? editing.name : '';
  const approvalVal = editing ? editing.approvalRequired : false;
  const approverNameVal = editing ? (editing.approverName||'') : '';
  const statusVal = editing ? editing.status : '';
  const commEmail = editing ? editing.commEmail : false;
  const commSMS = editing ? editing.commSMS : false;
  const commWA = editing ? editing.commWhatsApp : false;
  const emailTemplate = editing ? (editing.emailTemplate||'') : '';
  const smsTemplate = editing ? (editing.smsTemplate||'') : '';
  const waTemplate = editing ? (editing.whatsappTemplate||'') : '';
  const people = getAllPeople();
  const approverIsListed = people.some(p=>p.name===approverNameVal);

  let html = `<h2 class="title">${readOnly()?'Stages':'Create Your Stages'}</h2>`;
  if(editing && !readOnly()) html += `<div class="edit-banner">Editing <b>${escapeHtml(editing.name)}</b> — "Update Stage" to save, or "Cancel".</div>`;

  const statusIsPreset = STATUS_OPTIONS.includes(statusVal);
  const statusSelectVal = statusVal ? (statusIsPreset ? statusVal : 'Other / Custom') : '';
  const statusCustomVal = (statusVal && !statusIsPreset) ? statusVal : '';

  if(!readOnly()) html += `<div class="box">
    <div class="row">
      <div class="field"><label>Stage Name</label><input type="text" id="stNameInput" value="${escapeAttr(nameVal)}" placeholder="e.g. Student Details"></div>
      <div class="field"><label>Type of Stage</label><select id="stTypeInput" onchange="onStageTypeChange()">
        ${Object.keys(STAGE_TYPES).map(t=>`<option value="${escapeAttr(t)}" ${typeVal===t?'selected':''}>${escapeHtml(t)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Status Update once complete</label>
        <select id="stStatusSelect" onchange="onStatusSelectChange()">
          <option value="">-- Select Status --</option>
          ${STATUS_OPTIONS.map(s=>`<option value="${escapeAttr(s)}" ${statusSelectVal===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
          <option value="Other / Custom" ${statusSelectVal==='Other / Custom'?'selected':''}>Other / Custom</option>
        </select>
        <input type="text" id="stStatusCustomInput" value="${escapeAttr(statusCustomVal)}" placeholder="Type your own status" style="margin-top:6px;display:${statusSelectVal==='Other / Custom'?'block':'none'}">
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Approval Required?</label>
        <div class="radio-row">
          <label><input type="radio" name="stApproval" value="yes" ${approvalVal?'checked':''} onchange="toggleApproverNameField()"> Yes</label>
          <label><input type="radio" name="stApproval" value="no" ${!approvalVal?'checked':''} onchange="toggleApproverNameField()"> No</label>
        </div>
      </div>
      <div class="field" id="approverNameWrap" style="display:${approvalVal?'block':'none'}">
        <label>Counsellor who approves this stage</label>
        <select id="stApproverSelect" onchange="onApproverSelectChange()">
          <option value="">-- Select Counsellor --</option>
          ${people.map(p=>`<option value="${escapeAttr(p.name)}" ${approverNameVal===p.name?'selected':''}>${escapeHtml(p.label)}</option>`).join('')}
          <option value="Other / Custom" ${(approverNameVal && !approverIsListed)?'selected':''}>Other / Custom</option>
        </select>
        ${people.length===0?'<div class="empty" style="padding:4px 0;">No employees added yet — add them under "Institute &amp; Employees".</div>':''}
        <input type="text" id="stApproverCustomInput" value="${escapeAttr((approverNameVal && !approverIsListed)?approverNameVal:'')}" placeholder="Type name" style="margin-top:6px;display:${(approverNameVal && !approverIsListed)?'block':'none'}">
      </div>
    </div>
    <div class="field"><label>Communication — notify parent when this stage is done?</label>
      <div class="check-row">
        <label><input type="checkbox" id="stCommEmail" ${commEmail?'checked':''} onchange="toggleCommTemplate('Email')"> Email</label>
        <label><input type="checkbox" id="stCommSMS" ${commSMS?'checked':''} onchange="toggleCommTemplate('SMS')"> SMS</label>
        <label><input type="checkbox" id="stCommWA" ${commWA?'checked':''} onchange="toggleCommTemplate('WhatsApp')"> WhatsApp</label>
      </div>
    </div>
    <div class="row">
      <div class="field" id="tmplWrap_Email" style="display:${commEmail?'block':'none'}"><label>Email Template</label><textarea id="stTemplateEmail">${escapeHtml(emailTemplate)}</textarea></div>
      <div class="field" id="tmplWrap_SMS" style="display:${commSMS?'block':'none'}"><label>SMS Template</label><textarea id="stTemplateSMS">${escapeHtml(smsTemplate)}</textarea></div>
      <div class="field" id="tmplWrap_WhatsApp" style="display:${commWA?'block':'none'}"><label>WhatsApp Template</label><textarea id="stTemplateWhatsApp">${escapeHtml(waTemplate)}</textarea></div>
    </div>
    <button class="primary" onclick="saveStageForm()">${editing?'Update Stage':'Add Stage'}</button>
    ${editing?`<button onclick="cancelEditStage()">Cancel</button>`:''}
  </div>`;

  html += `<h3 style="font-size:14.5px;margin-bottom:8px;">Your Stages (${ap().stages.length})</h3>`;
  if(ap().stages.length===0){
    html += `<p class="empty">No stages yet.</p>`;
  } else {
    html += `<ul class="stage-list">`;
    ap().stages.forEach((s,i)=>{
      const comm = [s.commEmail&&'Email', s.commSMS&&'SMS', s.commWhatsApp&&'WhatsApp'].filter(Boolean).join(', ')||'None';
      const removing = pendingRemoveKey==='apstage_'+s.id;
      html += `<li><div><div><b>${i+1}. ${escapeHtml(s.name)}</b> <span style="color:var(--dim);font-size:12px;">(${escapeHtml(s.type)})</span></div>
        <div class="meta">Approval: ${s.approvalRequired?('Yes — '+escapeHtml(s.approverName||'—')):'No'} &middot; Status: ${escapeHtml(s.status||'—')} &middot; Notify: ${comm} &middot; Fields: ${s.fields.length}</div></div>
        <div><button class="small" onclick="editStage('${s.id}')">Edit</button> <button class="small link danger" title="Remove" onclick="removeStage('${s.id}')">${removing?'Confirm?':'✕'}</button></div></li>`;
    });
    html += `</ul>`;
  }
  if(ap().stages.length>0) html += `<div class="pager"><span></span><button data-keep class="primary" onclick="apGoPhase('fields')">${readOnly()?'View Fields →':'Continue to Add Fields →'}</button></div>`;
  return html;
}
function onStageTypeChange(){
  const type = document.getElementById('stTypeInput').value;
  const nameInput = document.getElementById('stNameInput');
  if(!nameInput.value.trim()) nameInput.value = type;
}
function onStatusSelectChange(){
  document.getElementById('stStatusCustomInput').style.display = (document.getElementById('stStatusSelect').value==='Other / Custom')?'block':'none';
}
function onApproverSelectChange(){
  document.getElementById('stApproverCustomInput').style.display = (document.getElementById('stApproverSelect').value==='Other / Custom')?'block':'none';
}
function toggleApproverNameField(){
  document.getElementById('approverNameWrap').style.display = (document.querySelector('input[name=stApproval]:checked').value==='yes')?'block':'none';
}
function toggleCommTemplate(channel){
  const cb = document.getElementById('stComm'+(channel==='WhatsApp'?'WA':channel));
  document.getElementById('tmplWrap_'+channel).style.display = cb.checked?'block':'none';
}
function saveStageForm(){
  const type = document.getElementById('stTypeInput').value;
  const name = document.getElementById('stNameInput').value.trim() || type;
  const approvalRequired = document.querySelector('input[name=stApproval]:checked').value==='yes';
  let approverName = '';
  if(approvalRequired){
    const sel = document.getElementById('stApproverSelect').value;
    approverName = (sel==='Other / Custom') ? document.getElementById('stApproverCustomInput').value.trim() : sel;
  }
  const status = (document.getElementById('stStatusSelect').value==='Other / Custom')
    ? document.getElementById('stStatusCustomInput').value.trim() : document.getElementById('stStatusSelect').value;
  const commEmail = document.getElementById('stCommEmail').checked;
  const commSMS = document.getElementById('stCommSMS').checked;
  const commWhatsApp = document.getElementById('stCommWA').checked;
  const emailTemplate = commEmail ? document.getElementById('stTemplateEmail').value.trim() : '';
  const smsTemplate = commSMS ? document.getElementById('stTemplateSMS').value.trim() : '';
  const whatsappTemplate = commWhatsApp ? document.getElementById('stTemplateWhatsApp').value.trim() : '';
  if(ap().editingStageId){
    const s = getStage(ap().editingStageId);
    Object.assign(s, {type,name,approvalRequired,approverName,status,commEmail,commSMS,commWhatsApp,emailTemplate,smsTemplate,whatsappTemplate});
    ap().editingStageId = null;
  } else {
    ap().stages.push({id:uid('st'), type, name, approvalRequired, approverName, status, commEmail, commSMS, commWhatsApp, emailTemplate, smsTemplate, whatsappTemplate, fields:[]});
  }
  saveState(); renderAll();
}
function editStage(id){ ap().editingStageId=id; pendingRemoveKey=null; saveState(); renderAll(); }
function cancelEditStage(){ ap().editingStageId=null; renderAll(); }
function removeStage(id){
  const pk = 'apstage_'+id;
  if(pendingRemoveKey===pk){ ap().stages=ap().stages.filter(s=>s.id!==id); if(ap().editingStageId===id) ap().editingStageId=null; pendingRemoveKey=null; saveState(); renderAll(); }
  else { pendingRemoveKey=pk; renderAll(); setTimeout(()=>{ if(pendingRemoveKey===pk){pendingRemoveKey=null; renderAll();} },3000); }
}

function renderApFieldsPhase(){
  if(ap().stages.length===0) return `<p class="empty">Create at least one stage first.</p>`;
  if(ap().currentStageIndex>=ap().stages.length) ap().currentStageIndex=ap().stages.length-1;
  const idx = ap().currentStageIndex;
  const stage = ap().stages[idx];
  const comm = [stage.commEmail&&'Email', stage.commSMS&&'SMS', stage.commWhatsApp&&'WhatsApp'].filter(Boolean).join(', ')||'None';
  let html = `<p style="color:var(--dim);font-size:12.8px;margin-bottom:2px;">Stage ${idx+1} of ${ap().stages.length}</p>
  <h2 class="title" style="margin-bottom:10px;">${escapeHtml(stage.name)}</h2>
  <div style="font-size:12.8px;color:var(--dim);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px;">
    Type: <b style="color:var(--text);">${escapeHtml(stage.type)}</b> &middot; Approval: <b style="color:var(--text);">${stage.approvalRequired?('Yes ('+escapeHtml(stage.approverName||'—')+')'):'No'}</b> &middot;
    Status: <b style="color:var(--text);">${escapeHtml(stage.status||'—')}</b> &middot; Notify: <b style="color:var(--text);">${comm}</b>
  </div>`;
  const suggestions = STAGE_TYPES[stage.type]||[];
  const already = stage.fields.map(f=>f.label);
  const remaining = suggestions.filter(s=>!already.includes(s));
  if(remaining.length && !readOnly()){
    html += `<div class="box">
      <label style="display:block;font-weight:600;font-size:13px;margin-bottom:8px;">Quick add — common fields</label>
      <div class="check-row" style="flex-direction:column;align-items:flex-start;gap:7px;margin-bottom:10px;">
        <label><input type="checkbox" onchange="toggleSelectAllSuggest(this.checked)"> <b>Select All</b></label>
        ${remaining.map(s=>`<label><input type="checkbox" class="suggestCheck" value="${escapeAttr(s)}"> ${escapeHtml(s)}</label>`).join('')}
      </div>
      <button class="primary" onclick="addSelectedSuggestions('${stage.id}')">Add Selected Fields</button>
    </div>`;
  }
  html += `<h3 style="font-size:14.5px;margin-bottom:8px;">Fields (${stage.fields.length})</h3>`;
  if(stage.fields.length===0){ html += `<p class="empty">No fields yet.</p>`; }
  else { stage.fields.forEach((f,i)=>{ html += renderFieldRow(stage, f, i, stage.fields.length); }); }
  html += `<button onclick="addBlankField('${stage.id}')">+ Add a New Field</button>`;
  html += `<div class="pager"><button data-keep ${idx===0?'disabled':''} onclick="apPrevStage()">← Previous Stage</button>
    ${idx<ap().stages.length-1 ? `<button data-keep class="primary" onclick="apNextStage()">Next Stage →</button>` : `<button data-keep class="primary" onclick="apGoPhase('preview')">Finish — Preview →</button>`}
  </div>`;
  return html;
}
function apPrevStage(){ ap().currentStageIndex=Math.max(0,ap().currentStageIndex-1); if(!readOnly()) saveState(); renderAll(); }
function apNextStage(){ ap().currentStageIndex=Math.min(ap().stages.length-1,ap().currentStageIndex+1); if(!readOnly()) saveState(); renderAll(); }
function toggleSelectAllSuggest(checked){ document.querySelectorAll('.suggestCheck').forEach(cb=>cb.checked=checked); }
function addSelectedSuggestions(stageId){
  const checked = Array.from(document.querySelectorAll('.suggestCheck:checked')).map(cb=>cb.value);
  if(checked.length===0){ showToast('Tick at least one field first.'); return; }
  const s = getStage(stageId);
  checked.forEach(label=>{ const preset=FIELD_PRESETS[label]||{type:'Text'}; s.fields.push(mkField(label,preset.type,preset)); });
  saveState(); renderAll();
}
function addBlankField(stageId){ const s=getStage(stageId); const f=mkField('New Field','Text',{}); f._open=true; s.fields.push(f); saveState(); renderAll(); }

function renderFieldRow(stage, f, idx, total){
  const ti = typeInfo(f.type);
  let html = `<div class="field-row"><div class="summary">
    <div class="txt"><b>${escapeHtml(f.label)}</b> — <span class="type">${escapeHtml(ti.l)}${f.mandatory?' · Mandatory':''}</span></div>
    <div style="display:flex;gap:4px;">
      <button title="Up" ${idx===0?'disabled':''} onclick="moveField('${stage.id}','${f.id}',-1)">↑</button>
      <button title="Down" ${idx===total-1?'disabled':''} onclick="moveField('${stage.id}','${f.id}',1)">↓</button>
      <button class="small" onclick="toggleFieldOpen('${stage.id}','${f.id}')">${f._open?'Close':'Edit'}</button>
      <button class="small link danger" title="Remove" onclick="removeField('${stage.id}','${f.id}')">✕</button>
    </div></div>`;
  if(f._open && !readOnly()) html += `<div class="edit">${renderFieldEditor(stage,f)}</div>`;
  html += `</div>`;
  return html;
}
function moveField(stageId, fieldId, dir){
  const s=getStage(stageId); const i=s.fields.findIndex(f=>f.id===fieldId); const j=i+dir;
  if(j<0||j>=s.fields.length) return;
  const t=s.fields[i]; s.fields[i]=s.fields[j]; s.fields[j]=t; saveState(); renderAll();
}
function toggleFieldOpen(stageId, fieldId){ const f=getField(stageId,fieldId); f._open=!f._open; saveState(); renderAll(); }
function removeField(stageId, fieldId){ const s=getStage(stageId); s.fields=s.fields.filter(f=>f.id!==fieldId); saveState(); renderAll(); }

function renderFieldEditor(stage, f){
  const ti = typeInfo(f.type);
  let html = `<div class="row">
    <div class="field"><label>Field Name</label><input type="text" value="${escapeAttr(f.label)}" oninput="updateField('${stage.id}','${f.id}','label',this.value,false)"></div>
    <div class="field"><label>Field Type</label><select onchange="updateField('${stage.id}','${f.id}','type',this.value,true)">
      ${FIELD_TYPES.map(t=>`<option value="${t.v}" ${f.type===t.v?'selected':''}>${t.l}</option>`).join('')}
    </select></div>
    <div class="field"><label>Mandatory?</label><div class="radio-row">
      <label><input type="radio" name="mand_${f.id}" ${f.mandatory?'checked':''} onchange="updateField('${stage.id}','${f.id}','mandatory',true,false)"> Yes</label>
      <label><input type="radio" name="mand_${f.id}" ${!f.mandatory?'checked':''} onchange="updateField('${stage.id}','${f.id}','mandatory',false,false)"> No</label>
    </div></div>
  </div>`;
  if(ti.opts || !ti.file){
    html += `<div class="row">`;
    if(ti.opts){
      html += `<div class="field"><label>Choices</label><div class="chips">
        ${f.options.map((o,i)=>`<span class="chip">${escapeHtml(o)}<button onclick="removeOption('${stage.id}','${f.id}',${i})">×</button></span>`).join('')||'<span style="color:var(--dim);font-size:12.5px;">None yet</span>'}
        </div><div class="opt-add-row"><input type="text" id="optin_${f.id}" placeholder="Type, then Add" onkeydown="if(event.key==='Enter'){event.preventDefault();addOption('${stage.id}','${f.id}')}"><button type="button" onclick="addOption('${stage.id}','${f.id}')">Add</button></div></div>`;
    }
    if(!ti.file){
      html += `<div class="field"><label>Default Value</label>${ti.opts ?
        `<select onchange="updateField('${stage.id}','${f.id}','defaultValue',this.value,false)"><option value="">-- none --</option>${f.options.map(o=>`<option ${f.defaultValue===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>` :
        `<input type="${f.type==='Number'?'number':(f.type==='Date'?'date':'text')}" value="${escapeAttr(f.defaultValue)}" oninput="updateField('${stage.id}','${f.id}','defaultValue',this.value,false)">`
      }</div>`;
    }
    html += `</div>`;
  }
  html += `<details ${f._moreOpen?'open':''} ontoggle="onMoreToggle('${stage.id}','${f.id}',this.open)"><summary style="cursor:pointer;font-weight:600;color:var(--accent);margin-bottom:10px;">More options</summary>`;
  const allFields = [];
  ap().stages.forEach(s=>{ s.fields.forEach(fld=>{ if(fld.id!==f.id) allFields.push({stageName:s.name, field:fld}); }); });
  const hasOther = allFields.length>0;
  html += `<div class="field"><label>Only show this field if...</label><div class="radio-row" style="margin-bottom:8px;">
    <label><input type="radio" name="cond_${f.id}" ${f.condition?'checked':''} ${hasOther?'':'disabled'} onchange="toggleCondition('${stage.id}','${f.id}',true)"> Depends on another field</label>
    <label><input type="radio" name="cond_${f.id}" ${!f.condition?'checked':''} onchange="toggleCondition('${stage.id}','${f.id}',false)"> Always show</label>
  </div>${!hasOther?'<div style="color:var(--dim);font-size:12px;">Add another field first.</div>':''}`;
  if(f.condition){
    const target = allFields.find(af=>af.field.id===f.condition.targetId);
    html += `<div class="row"><div class="field"><label>Field to check</label><select onchange="setConditionTarget('${stage.id}','${f.id}',this.value)">
      ${allFields.map(af=>`<option value="${af.field.id}" ${f.condition.targetId===af.field.id?'selected':''}>${escapeHtml(af.stageName)} → ${escapeHtml(af.field.label)}</option>`).join('')}
      </select></div><div class="field"><label>Equals</label>${target && target.field.options && target.field.options.length ?
        `<select onchange="setConditionValue('${stage.id}','${f.id}',this.value)">${target.field.options.map(o=>`<option ${f.condition.value===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>` :
        `<input type="text" value="${escapeAttr(f.condition.value)}" oninput="setConditionValue('${stage.id}','${f.id}',this.value)">`
      }</div></div>`;
  }
  html += `</div>
  <div class="row">
    <div class="field"><label>Repeats For</label><input type="text" value="${escapeAttr(f.repeatsFor)}" oninput="updateField('${stage.id}','${f.id}','repeatsFor',this.value,false)" placeholder="e.g. Father, Mother"></div>
    <div class="field"><label>Filled By</label><select onchange="updateField('${stage.id}','${f.id}','filledBy',this.value,false)">${['Parent','Staff','System'].map(v=>`<option ${f.filledBy===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label>Confidential?</label><div class="radio-row">
      <label><input type="radio" name="restr_${f.id}" ${f.restricted?'checked':''} onchange="updateField('${stage.id}','${f.id}','restricted',true,false)"> Yes</label>
      <label><input type="radio" name="restr_${f.id}" ${!f.restricted?'checked':''} onchange="updateField('${stage.id}','${f.id}','restricted',false,false)"> No</label>
    </div></div>
  </div>
  <div class="field"><label>Notes</label><textarea oninput="updateField('${stage.id}','${f.id}','notes',this.value,false)">${escapeHtml(f.notes)}</textarea></div>
  </details>
  <button class="primary" onclick="saveFieldEditor('${stage.id}','${f.id}')">Save</button>`;
  return html;
}
function saveFieldEditor(stageId, fieldId){ const f=getField(stageId,fieldId); if(f) f._open=false; saveState(); renderAll(); }
function onMoreToggle(stageId, fieldId, open){ const f=getField(stageId,fieldId); f._moreOpen=open; saveState(); }
function updateField(stageId, fieldId, prop, value, rerender){ const f=getField(stageId,fieldId); if(!f) return; f[prop]=value; saveState(); if(rerender) renderAll(); }
function addOption(stageId, fieldId){ const input=document.getElementById('optin_'+fieldId); const val=(input.value||'').trim(); if(!val) return; getField(stageId,fieldId).options.push(val); input.value=''; saveState(); renderAll(); }
function removeOption(stageId, fieldId, idx){ const f=getField(stageId,fieldId); const removed=f.options[idx]; f.options.splice(idx,1); if(f.defaultValue===removed) f.defaultValue=''; saveState(); renderAll(); }
function toggleCondition(stageId, fieldId, on){
  const f = getField(stageId, fieldId);
  if(on){ const other=ap().stages.flatMap(s=>s.fields).find(x=>x.id!==fieldId); if(!other){ showToast('Add another field first.'); return; } f.condition={targetId:other.id, value:(other.options[0]||'')}; }
  else { f.condition=null; }
  saveState(); renderAll();
}
function setConditionTarget(stageId, fieldId, targetId){ const f=getField(stageId,fieldId); const target=ap().stages.flatMap(s=>s.fields).find(x=>x.id===targetId); f.condition={targetId, value:(target&&target.options[0])||''}; saveState(); renderAll(); }
function setConditionValue(stageId, fieldId, value){ getField(stageId,fieldId).condition.value=value; saveState(); }

function renderApPreviewPhase(){
  if(ap().currentStageIndex>=ap().stages.length) ap().currentStageIndex=0;
  const idx = ap().currentStageIndex;
  const stage = ap().stages[idx];
  if(!stage) return `<p class="empty">No stages.</p>`;
  let html = `<h2 class="title">Preview</h2>`;
  html += `<div class="stepper-scroll" style="margin-bottom:16px;"><div class="stepper">` + ap().stages.map((s,i)=>{
    const cls=['stepper-item']; if(i===idx) cls.push('active');
    const line = i<ap().stages.length-1 ? '<div class="stepper-line"></div>' : '';
    return `<div class="${cls.join(' ')}" onclick="apJumpPreview(${i})"><div class="stepper-circle">${i+1}</div><div class="stepper-label">${escapeHtml(s.name)}</div></div>${line}`;
  }).join('') + `</div></div>`;
  if(stage.status) html += `<div class="status-banner">After this stage, status becomes: “${escapeHtml(stage.status)}”</div>`;
  html += `<div class="box">`;
  if(stage.fields.length===0) html += `<p class="empty">No fields in this stage.</p>`;
  else stage.fields.forEach(f=>{ html += renderPreviewField(f); });

    <span><button data-keep onclick="exportOne('json')">Download JSON</button> <button data-keep class="primary" onclick="exportOne('csv')">Download CSV</button></span></div>`;
  return html;
}
function apJumpPreview(i){ ap().currentStageIndex=i; if(!readOnly()) saveState(); renderAll(); }
function renderPreviewField(f){
  const ti = typeInfo(f.type);
  const star = f.mandatory?' <span class="req">*</span>':'';
  let inner='';
  if(ti.file){ inner = `<div class="pv-file">${f.type==='SystemGenerated'?'Filled automatically by the system':'Click to upload'}</div>`; }
  else if(f.type==='Dropdown'||f.type==='Choice'){ inner = `<select id="pvin_${f.id}" onchange="onPreviewChange()"><option value="">-- Select --</option>${f.options.map(o=>`<option ${f.defaultValue===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`; }
  else if(f.type==='MultiSelect'){ inner = `<div class="choice-row">${f.options.map(o=>`<label><input type="checkbox" value="${escapeAttr(o)}"> ${escapeHtml(o)}</label>`).join('')}</div>`; }
  else if(f.type==='Checkbox'){ inner = `<div class="choice-row"><label><input type="checkbox" id="pvin_${f.id}" onchange="onPreviewChange()"> Yes</label></div>`; }
  else if(f.type==='Textarea'){ inner = `<textarea id="pvin_${f.id}" oninput="onPreviewChange()">${escapeHtml(f.defaultValue)}</textarea>`; }
  else { const it=f.type==='Number'?'number':(f.type==='Date'?'date':(f.type==='Email'?'email':(f.type==='Phone'?'tel':'text'))); inner = `<input type="${it}" id="pvin_${f.id}" value="${escapeAttr(f.defaultValue)}" oninput="onPreviewChange()">`; }
  const rep = f.repeatsFor ? `<div style="color:var(--dim);font-size:12px;margin-bottom:6px;">Repeats for: ${escapeHtml(f.repeatsFor)}</div>` : '';
  return `<div class="pv-field" id="pvwrap_${f.id}"><label>${escapeHtml(f.label)}${star}</label>${rep}${inner}</div>`;
}
function readPreviewValue(fieldId){ const el=document.getElementById('pvin_'+fieldId); if(!el) return ''; if(el.type==='checkbox') return el.checked?'Yes':'No'; return el.value; }
function wireConditionals(){
  const stage = ap().stages[ap().currentStageIndex]; if(!stage) return;
  stage.fields.filter(f=>f.condition).forEach(f=>{ const wrap=document.getElementById('pvwrap_'+f.id); if(!wrap) return; wrap.style.display=(readPreviewValue(f.condition.targetId)===f.condition.value)?'':'none'; });
}
function onPreviewChange(){ wireConditionals(); }

function slugify(str){ return (str||'').toString().trim().toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'STATUS'; }
function buildApRows(){
  const rows=[];
  ap().stages.forEach((stage,i)=>{
    const comm = [stage.commEmail&&'Email', stage.commSMS&&'SMS', stage.commWhatsApp&&'WhatsApp'].filter(Boolean).join(', ')||'None';
    const base = { 'Stage No.':i+1, 'Stage Type':stage.type, 'Stage Name':stage.name, 'Approval Required? (Y/N)':stage.approvalRequired?'Y':'N',
      'Approver / Counsellor':stage.approverName||'', 'Status Code':slugify(stage.status), 'Status Label':stage.status, 'Communication Channel':comm,
      'Email Template':stage.emailTemplate||'', 'SMS Template':stage.smsTemplate||'', 'WhatsApp Template':stage.whatsappTemplate||'' };
    if(stage.fields.length===0){ rows.push(Object.assign({},base,{'Field Name':'','Field Type':'','Filled By':'','Mandatory? (Y/N)':'','Repeats For':'','Options':'','Default Value':'','Conditional Rule':'','Confidential? (Y/N)':'','Notes':''})); return; }
    stage.fields.forEach(f=>{
      let cond='';
      if(f.condition){ const t=ap().stages.flatMap(s=>s.fields).find(x=>x.id===f.condition.targetId); cond=t?`Show only if "${t.label}" = "${f.condition.value}"`:''; }
      rows.push(Object.assign({},base,{'Field Name':f.label,'Field Type':typeInfo(f.type).l,'Filled By':f.filledBy,'Mandatory? (Y/N)':f.mandatory?'Y':'N','Repeats For':f.repeatsFor,'Options':f.options.join(', '),'Default Value':f.defaultValue,'Conditional Rule':cond,'Confidential? (Y/N)':f.restricted?'Y':'N','Notes':f.notes}));
    });
  });
  return rows;
}
function toCSV(rows){
  if(!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\r\n');
}
function offerDownload(filename, text){
  try{
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ showToast('Could not start the download.'); }
}
function exportOne(kind){
  const slug = slugify(state.institute.name||'school').toLowerCase();
  if(kind==='json') offerDownload(`${slug}-application-process.json`, JSON.stringify(ap().stages,null,2));
  else offerDownload(`${slug}-application-process.csv`, toCSV(buildApRows()));
}
function exportAll(){
  const slug = slugify(state.institute.name||'admission-prereq').toLowerCase();

/* ============================= INIT ============================= */
function applyServer(out){
  LOCKED = out.status === 'submitted';
  SUBMIT_INFO = LOCKED ? { at: out.submittedAt, name: (out.submittedBy && out.submittedBy.name) || '' } : null;
  if(out.institute) INSTITUTE = out.institute;
  if(out.sections) SAVED_SECTIONS = out.sections;
  if('data' in out) adoptData(out.data);
  if(out.lastSavedAt && !LOCKED) setSaveStatus('ok', 'Last saved ' + fmtDate(out.lastSavedAt));
}
function fatal(title, text){
  document.getElementById('root').innerHTML = `<div class="center-msg"><div class="card"><h2 style="font-size:18px;margin-bottom:8px;">${escapeHtml(title)}</h2><div style="color:var(--dim);">${escapeHtml(text)}</div></div></div>`;
}
async function boot(){
  try{
    let out;
    if(VIEW){
      const d = await api('GET', `${API_BASE}/api/prerequisites/data`, null, true);
      const meta = await api('GET', `${API_BASE}/api/prerequisites`, null, true);
      out = { status: d.status, submittedAt: d.submittedAt, submittedBy: meta.submittedBy, institute: meta.institute, data: d.data,
        sections: Object.fromEntries((meta.sections||[]).map(s=>[s.key, s.savedAt])) };
    } else {
      if(!TOKEN){ fatal('Link not valid', 'Please open the link exactly as it was sent to you.'); return; }
      out = await api('GET', PUBLIC_URL);
    }
    applyServer(out);
    if(readOnly()) { state.activeSection = state.activeSection || 'institute'; }
    renderShell();
    renderAll();
  }catch(e){
    if(e.status === 404) fatal('Link not valid', 'This link is not valid or has been replaced. Please ask for a new link.');
    else if(VIEW && e.status === 401) fatal('Sign in required', 'Sign in to the CRM, then open this view again.');
    else fatal('Could not load', e.message || 'Please check your connection and try again.');
  }
}
boot();
</script>
